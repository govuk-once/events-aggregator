name: Ephemeral Environment Cleanup

on:
  pull_request:
    types: [closed]

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '24'
  ENVIRONMENT: pr-${{ github.event.pull_request.number }}
  GITHUB_OWNER: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}
  FLEX_ACCOUNT_ID: ${{ vars.FLEX_ACCOUNT_ID }}
  FLEX_EXTERNAL_ID: ${{ vars.FLEX_EXTERNAL_ID }}

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Destroy Ephemeral Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get PNPM Version
        id: pnpm-version
        run: echo "pnpm_version=$(jq -r '.packageManager' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        run: npm install -g ${{ steps.pnpm-version.outputs.pnpm_version }}

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Dependancies
        run: pnpm i --frozen-lockfile

      - name: Configure AWS credentials
        id: aws-cred-dev
        uses: aws-actions/configure-aws-credentials@6782cb1b6df5d32e9354c1e6d6da4f956c0d61c4 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
          aws-region: eu-west-2
          output-credentials: true

      - name: Build Application
        continue-on-error: true
        run: pnpm run build

      - name: Deploy CDK stack
        run: pnpm run destroy:dev
        env:
          CDK_DEPLOYMENT_ROLE_ARN: ${{steps.aws-creds-dev.outputs.authenticated-arn}}
