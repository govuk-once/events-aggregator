name: Build & Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment to deploy to'
        type: string
        required: true
        default: 'dev'
      github-environment:
        description: 'Environment in github'
        type: string
        required: false
        default: 'dev'
      aws_region:
        description: 'AWS region'
        type: string
        required: false
        default: 'eu-west-2'
      VERSION:
        description: 'Semantic version being deployed'
        type: string
        default: '0.0.0'
        required: true
      notify-release:
        description: 'Announce a successful deployment in the release notifications Slack channel'
        type: boolean
        required: false
        default: true
    secrets:
      DEPLOYMENT_ROLE:
        description: 'AWS deployment role to assume'
        required: true

  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - development
          - staging
      aws_region:
        description: 'AWS region'
        required: false
        default: 'eu-west-2'
        type: string
      VERSION:
        description: 'Semantic version being deployed'
        type: string
        default: '0.0.0'
        required: true
      notify-release:
        description: 'Announce a successful deployment in the release notifications Slack channel'
        type: boolean
        required: false
        default: true
    secrets:
      DEPLOYMENT_ROLE:
        description: 'AWS deployment role to assume'
        required: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    env:
      FLEX_ACCOUNT_ID: ${{ vars.FLEX_ACCOUNT_ID }}
      FLEX_EXTERNAL_ID: ${{ vars.FLEX_EXTERNAL_ID }}
      ENVIRONMENT: ${{ inputs.environment }}
      VERSION: ${{ inputs.VERSION }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
      statuses: write
    concurrency:
      group: deploy-${{ inputs.environment }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0

      - name: Get PNPM Version
        id: pnpm-version
        run: echo "pnpm_version=$(jq -r '.packageManager' package.json)" >> $GITHUB_OUTPUT

      - name: Install pnpm
        run: npm install -g ${{ steps.pnpm-version.outputs.pnpm_version }}

      - name: setup node
        uses: actions/setup-node@8f152de45cc393bb48ce5d89d36b731f54556e65 #v4.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@3557a071ad648a12260a481c2e613d138d99c690 # v5.1.1
        with:
          role-to-assume: ${{ secrets.DEPLOYMENT_ROLE }}
          aws-region: ${{ inputs.aws_region }}
          output-env-credentials: true

      - name: Pre-deploy SSM parameter setup
        run: pnpm run cdk:predeploy
        env:
          SSM_PARAMETERS_TO_UPDATE: ${{ vars.SSM_PARAMETERS_TO_UPDATE }}

      - name: Build Application
        run: pnpm run build

      - name: Deploy to Environment
        run: pnpm run deploy:dev

      - name: Announce release in Slack
        # A missed announcement must not fail an otherwise-good deploy, so the
        # step reports into the job summary instead of failing the job.
        if: ${{ inputs.notify-release }}
        continue-on-error: true
        shell: bash
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          VERSION: ${{ inputs.VERSION }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail

          # Mirrors getResourceNamePrefix() in cdk/constants/environments.ts
          NAME_PREFIX="$(printf '%s' "${ENVIRONMENT}-events-aggregator" |
            tr '[:upper:]' '[:lower:]' | cut -c1-40)"
          STACK_NAME="${NAME_PREFIX}-stack"

          TOPIC_ARN="$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='ReleaseNotificationTopicArn'].OutputValue" \
            --output text 2>/dev/null || true)"

          if [ -z "${TOPIC_ARN}" ] || [ "${TOPIC_ARN}" = "None" ]; then
            echo "::warning title=Release notification skipped::${STACK_NAME} has no ReleaseNotificationTopicArn output."
            echo "### Release notification — ${ENVIRONMENT}" >> "${GITHUB_STEP_SUMMARY}"
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Result: ⚠️  skipped — no release notification topic on \`${STACK_NAME}\`." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # VERSION arrives as "<semver>@<sha>"; the release tag is the semver half.
          SEMVER="${VERSION%%@*}"
          if [ -n "${SEMVER}" ] && [ "${SEMVER}" != "0.0.0" ]; then
            LINK_URL="${SERVER_URL}/${REPOSITORY}/releases/tag/v${SEMVER}"
            LINK_TEXT="Release notes for v${SEMVER}"
          else
            LINK_URL="${RUN_URL}"
            LINK_TEXT="Workflow run"
          fi

          SERVICE="${REPOSITORY##*/}"
          DESCRIPTION="$(printf '*Version:* `%s`\n*Environment:* `%s`\n<%s|%s>' \
            "${VERSION}" "${ENVIRONMENT}" "${LINK_URL}" "${LINK_TEXT}")"

          # AWS Chatbot custom notification schema, so Slack renders a card
          # rather than a wall of raw JSON.
          MESSAGE="$(jq -nc \
            --arg title ":rocket: ${SERVICE} deployed to ${ENVIRONMENT}" \
            --arg description "${DESCRIPTION}" \
            --arg summary "${SERVICE} ${VERSION} deployed to ${ENVIRONMENT}" \
            --arg version "${VERSION}" \
            --arg environment "${ENVIRONMENT}" \
            --arg releaseUrl "${LINK_URL}" \
            --arg runUrl "${RUN_URL}" \
            '{
              version: "1.0",
              source: "custom",
              content: {
                textType: "client-markdown",
                title: $title,
                description: $description
              },
              metadata: {
                summary: $summary,
                eventType: "deployment.succeeded",
                additionalContext: {
                  version: $version,
                  environment: $environment,
                  release: $releaseUrl,
                  workflowRun: $runUrl
                }
              }
            }')"

          # Needs sns:Publish on the topic and kms:GenerateDataKey*/kms:Decrypt
          # on the notification key — the topic is encrypted at rest.
          aws sns publish --topic-arn "${TOPIC_ARN}" --message "${MESSAGE}" > /dev/null

          {
            echo "### Release notification — ${ENVIRONMENT}"
            echo ""
            echo "Result: ✅ published"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- Topic: \`${TOPIC_ARN}\`"
            echo "- Link: ${LINK_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"
