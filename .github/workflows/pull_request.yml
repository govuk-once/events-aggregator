name: Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  USER: pr-${{ github.event.pull_request.number }}
  ENVIRONMENT: pr-${{ github.event.pull_request.number }}

jobs:
  ValidatePR:
    name: Validate PR
    uses: ./.github/workflows/_validate_pr.yml

  QualityChecks:
    name: 🧪  Quality Checks
    needs: ValidatePR
    # needs: GetDependencies
    secrets: inherit # pragma: allowlist secret
    uses: ./.github/workflows/_quality_checks.yml

  DeployToEphemeral:
    name: 🛠️ Deploy To Ephemral Env
    needs: QualityChecks
    uses: ./.github/workflows/_build_deploy.yml
    with:
      environment: pr-${{ github.event.pull_request.number }}
      github-environment: development
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  SeedEphemeral:
    name: Seed Ephemeral data
    needs: DeployToEphemeral
    uses: ./.github/workflows/_seed_data.yml
    with:
      github-environment: development
      environment-name: pr-${{ github.event.pull_request.number }}
      service-name: dynamotable
      table-name: pr-${{ github.event.pull_request.number }}-dynamotable-sourceStore
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
