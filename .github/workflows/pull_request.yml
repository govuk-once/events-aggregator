name: Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

jobs:
  ValidatePR:
    name: Validate PR
    uses: ./.github/workflows/_validate_pr.yml
  QualityChecks:
    name: 🧪  Quality Checks
    needs: ValidatePR
    # needs: GetDependencies
    secrets: inherit
    uses: ./.github/workflows/_quality_checks.yml

  DeployToDev:
    name: 🛠️ Deploy To Dev Env
    needs: QualityChecks
    secrets: inherit
    uses: ./.github/workflows/_build_deploy.yml
    with:
      environment: development

  SeedDev:
    name: Seed dev data
    needs: deploy-dev
    uses: ./.github/workflows/__seed-data.yml
    with:
      environment-name: development
      service-name: travel-alerts
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}
