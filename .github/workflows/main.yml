name: Pull Request

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write
  statuses: write

jobs:
  QualityChecks:
    name: 🧪  Quality Checks
    # needs: GetDependencies
    secrets: inherit
    uses: ./.github/workflows/_quality_checks.yml

  Release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      semVer: ${{ steps.release.outputs.semVer }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: ⚙️ Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Semantic Release
        id: release
        run: pnpm run semantic:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        run: echo "The next version is ${{ steps.release.outputs.semVer }}"

  DeployToDev:
    name: 🛠️  Deploy To Dev Env
    needs: Release
    uses: ./.github/workflows/_build_deploy.yml
    with:
      environment: development
      github-environment: development
      VERSION: ${{needs.Release.outputs.semVer}}@${{ github.sha }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  SeedDev:
    name: Seed dev data
    needs: DeployToDev
    uses: ./.github/workflows/_seed_data.yml
    with:
      environment-name: development
      service-name: dynamotable
      table-name: development-dynamotable-sourceStore
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.DEV_DEPLOYMENT_ROLE }}

  DeployToStaging:
    name: 🛠️  Deploy To Staging Env
    needs:
      - Release
      - DeployToDev
    uses: ./.github/workflows/_build_deploy.yml
    with:
      environment: staging
      github-environment: staging
      VERSION: ${{needs.Release.outputs.semVer}}@${{ github.sha }}
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}

  SeedStaging:
    name: Seed dev data
    needs: DeployToStaging
    uses: ./.github/workflows/_seed_data.yml
    with:
      environment-name: staging
      service-name: dynamotable
      table-name: staging-dynamotable-sourceStore
    secrets:
      DEPLOYMENT_ROLE: ${{ secrets.STAGING_DEPLOYMENT_ROLE }}
